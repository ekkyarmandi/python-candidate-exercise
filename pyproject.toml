[project]
name = "messy-crm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ekky Armandi", email = "ekky@softwareseni.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=4.2,<6.0",
    "gunicorn>=23",
    "psycopg[binary]>=3.3.6",
    "python-decouple>=3.8",
    "whitenoise>=6.8",
]

# Quality tooling. Installed by `uv sync` (dev is the default group); production
# deployments install with `uv sync --no-dev --locked`.
[dependency-groups]
dev = [
    "bandit>=1.8",
    "coverage[toml]>=7.10",
    "pip-audit>=2.9",
    "ruff>=0.17",
]

# Django application, not a distributable package: dependencies are installed,
# the project itself is never built into a wheel.
[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
# `.pi` holds agent skill documents whose Markdown code blocks are not our code.
extend-exclude = [".pi", "frontend", "openspec"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "DJ"]
ignore = [
    # DJ008: crm.models.Contact has no __str__ yet. Tracked as a model change,
    # not something CI should force in an infrastructure commit.
    "DJ008",
]

[tool.ruff.lint.isort]
known-first-party = ["crm", "messycrm"]

[tool.ruff.lint.per-file-ignores]
# Django settings modules are built by star-importing the shared base.
"messycrm/settings/*.py" = ["F403", "F405"]

# Django's migration writer emits single-quoted, compact code. Linting still
# applies to migrations, but formatting them would mean re-formatting every
# generated file, so the formatter leaves them alone.
[tool.ruff.format]
exclude = ["*/migrations/*.py"]

[tool.coverage.run]
source = ["crm", "messycrm"]
omit = [
    "*/migrations/*",
    "*/settings/*",
    "*/templatetags/__init__.py",
    "crm/test_api.py",
    "crm/tests.py",
    "messycrm/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

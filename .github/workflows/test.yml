name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Run static checks
        run: ./scripts/ci.sh static

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Run the AI reviewer's unit tests
        run: ./scripts/ci.sh unit

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint, type check and build
        run: ./scripts/ci.sh frontend

      - uses: actions/upload-artifact@v4
        with:
          name: vite-dist
          path: crm/static/crm/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test:
    name: test
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: messycrm
          POSTGRES_PASSWORD: messycrm
          POSTGRES_DB: messycrm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U messycrm -d messycrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://messycrm:messycrm@localhost:5432/messycrm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true

      - uses: actions/download-artifact@v4
        with:
          name: vite-dist
          path: crm/static/crm/dist

      - name: Run the suite
        run: ./scripts/ci.sh test

  gate:
    name: gate
    if: always()
    needs: [static, unit, frontend, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every stage to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "stage results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required stage finished with '$result'"
              exit 1
            fi
          done
          echo "all stages passed"

  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - "crm/**"
              - "messycrm/**"
              - "scripts/**"
              - "frontend/src/**"
              - "frontend/index.html"
              - "manage.py"

  ai-review:
    name: ai-review
    needs: [gate, changes]
    if: github.event.pull_request.draft == false && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Review the diff
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/ai_review.py
